# TravelGraph Platform — local orchestration.
#
# Profiles:
#   * default (no profile flag): postgres + redis only.
#   * `subgraphs`: postgres + redis + all 5 subgraph services.
#   * `router`:   the Rust router (Phase 2). Requires the `subgraphs`
#                 profile to also be active so its upstreams exist.
#
# Quick start:
#   docker-compose up postgres redis                            # infra only
#   docker-compose --profile subgraphs up                       # subgraphs
#   docker-compose --profile subgraphs --profile router up       # full stack
#   make up        / make up-all                                 # via Makefile

services:
  postgres:
    image: postgres:16-alpine
    container_name: travelgraph-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: travelgraph
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d travelgraph"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: travelgraph-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  property-service:
    build:
      context: ./services/property-service
    container_name: travelgraph-property-service
    profiles: ["subgraphs"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: travelgraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8081:8081"

  pricing-service:
    build:
      context: ./services/pricing-service
    container_name: travelgraph-pricing-service
    profiles: ["subgraphs"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: travelgraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8082:8082"

  booking-service:
    build:
      context: ./services/booking-service
    container_name: travelgraph-booking-service
    profiles: ["subgraphs"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: travelgraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8083:8083"

  user-service:
    build:
      context: ./services/user-service
    container_name: travelgraph-user-service
    profiles: ["subgraphs"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: travelgraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8084:8084"

  review-service:
    build:
      context: ./services/review-service
    container_name: travelgraph-review-service
    profiles: ["subgraphs"]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: travelgraph
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "8085:8085"

  router:
    build:
      context: ./router
    container_name: travelgraph-router
    profiles: ["router"]
    restart: unless-stopped
    depends_on:
      property-service:
        condition: service_started
      pricing-service:
        condition: service_started
      booking-service:
        condition: service_started
      user-service:
        condition: service_started
      review-service:
        condition: service_started
    environment:
      ROUTER_PORT: 8080
      ROUTER_SUBGRAPH_CONFIG: /app/config/subgraphs.yaml
      ROUTER_SUPERGRAPH_PATH: /app/config/supergraph.graphql
      RUST_LOG: ${RUST_LOG:-info}
      ROUTER_LOG_FORMAT: ${ROUTER_LOG_FORMAT:-json}
      PROPERTY_SERVICE_URL: http://property-service:8081/graphql
      PRICING_SERVICE_URL:  http://pricing-service:8082/graphql
      BOOKING_SERVICE_URL:  http://booking-service:8083/graphql
      USER_SERVICE_URL:     http://user-service:8084/graphql
      REVIEW_SERVICE_URL:   http://review-service:8085/graphql
    # Phase 3.3: bind-mount the composer's output so `make compose` updates the router
    # without rebuilding its image. The router fails to boot if this file does not
    # exist, so the workflow is: `make up` -> `make compose` -> `make up-all`.
    volumes:
      - ./schema-registry/output/supergraph.graphql:/app/config/supergraph.graphql:ro
    ports:
      - "8080:8080"

volumes:
  postgres-data:
    name: travelgraph-postgres-data
