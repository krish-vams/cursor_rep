[workspace]
resolver = "2"
members = ["crates/travelgraph-router"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
tokio          = { version = "1.36", features = ["full"] }
axum           = { version = "0.7.5", features = ["macros"] }
tower          = "0.4"
tower-http     = { version = "0.5", features = ["trace", "timeout", "limit", "cors"] }
hyper          = { version = "1.2", features = ["full"] }
serde          = { version = "1.0", features = ["derive"] }
serde_json     = "1.0"
serde_yaml     = "0.9"
tracing        = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt"] }
reqwest        = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2"] }
apollo-parser  = "0.8"
uuid           = { version = "1.7", features = ["v4", "serde"] }
anyhow         = "1.0"
thiserror      = "1.0"
futures        = "0.3"
async-trait    = "0.1"

[profile.release]
# Smaller binary -> smaller distroless image.
codegen-units = 1
lto           = "thin"
strip         = "symbols"
panic         = "abort"
opt-level     = 3
